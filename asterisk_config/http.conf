; ============================================================================
; asterisk_config/http.conf
; Built-in HTTP Server for Asterisk ARI & WebSockets (WebRTC)
; ============================================================================

[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
prefix =
sessionlimit = 100
session_inactivity = 30000
session_keep_alive = 15000

; TLS / WSS Configuration for WebRTC over HTTPS/WSS
tlsenable = yes
tlsbindaddr = 0.0.0.0:8089
tlscertfile = /etc/asterisk/keys/asterisk.crt
tlsprivatekey = /etc/asterisk/keys/asterisk.key

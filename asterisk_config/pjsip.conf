; ============================================================================
; asterisk_config/pjsip.conf
; Asterisk PJSIP Configuration for Agentic HR VoiceBot
; ============================================================================

[global]
type=global
user_agent=Asterisk-HRVoiceBot

; ----------------------------------------------------------------------------
; Transports
; ----------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; ----------------------------------------------------------------------------
; Softphone Extension 100 (MicroSIP / Zoiper)
; ----------------------------------------------------------------------------
[100]
type=endpoint
context=hr-voicebot-inbound
transport=transport-udp
disallow=all
allow=ulaw
allow=alaw
allow=slin
allow=slin16
auth=100-auth
aors=100
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[100-auth]
type=auth
auth_type=userpass
username=100
password=1234

[100]
type=aor
max_contacts=5
remove_existing=yes

; ----------------------------------------------------------------------------
; Extension 1001 (Default Employee Line)
; ----------------------------------------------------------------------------
[1001]
type=endpoint
context=hr-voicebot-inbound
transport=transport-udp
disallow=all
allow=ulaw
allow=alaw
allow=slin
allow=slin16
auth=1001-auth
aors=1001
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=1234

[1001]
type=aor
max_contacts=5
remove_existing=yes

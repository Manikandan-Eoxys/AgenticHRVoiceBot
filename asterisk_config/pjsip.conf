; ============================================================================
; asterisk_config/pjsip.conf
; Asterisk PJSIP Configuration for Agentic HR VoiceBot
; ============================================================================

[global]
type=global
user_agent=Asterisk-HRVoiceBot

; ----------------------------------------------------------------------------
; Transports (Public IP: 115.99.235.223 | LAN: 192.168.1.0/24, host 192.168.1.4)
; If the public IP changes, update BOTH external_* lines and the Plivo trunks.
; ----------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5080
external_media_address=115.99.235.223
external_signaling_address=115.99.235.223
external_signaling_port=5080
local_net=192.168.1.0/24
local_net=127.0.0.1/32

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_media_address=115.99.235.223
external_signaling_address=115.99.235.223
local_net=192.168.1.0/24
local_net=127.0.0.1/32

; ----------------------------------------------------------------------------
; Softphone Extension 100 (MicroSIP / Zoiper)
; ----------------------------------------------------------------------------
[100]
type=endpoint
context=hr-voicebot-inbound
transport=transport-udp
disallow=all
allow=ulaw
allow=alaw
allow=slin
allow=slin16
auth=100-auth
aors=100
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[100-auth]
type=auth
auth_type=userpass
username=100
password=ZTz3OpQVpwy8HK4kHUUP

[100]
type=aor
max_contacts=5
remove_existing=yes

; ----------------------------------------------------------------------------
; Extension 1001 (Default Employee Line)
; ----------------------------------------------------------------------------
[1001]
type=endpoint
context=hr-voicebot-inbound
transport=transport-udp
disallow=all
allow=ulaw
allow=alaw
allow=slin
allow=slin16
auth=1001-auth
aors=1001
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=AAbCPrpOArxP9KyNh0YA

[1001]
type=aor
max_contacts=5
remove_existing=yes

; ----------------------------------------------------------------------------
; Plivo Inbound SIP Trunk (matched by source IP)
; ----------------------------------------------------------------------------
[plivo-inbound]
type=endpoint
context=hr-voicebot-inbound
transport=transport-udp
disallow=all
allow=ulaw
allow=alaw
allow=slin
allow=slin16
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[plivo-identify]
type=identify
endpoint=plivo-inbound
; Plivo India / APAC media & signaling servers
match=15.207.90.192/31
match=204.89.151.128/27
match=204.89.151.160/27
; Plivo US / Global failover servers
match=3.215.109.192/27
match=52.55.231.224/27
match=54.241.63.240/28
match=3.120.131.60/32
match=18.185.135.192/27
match=54.254.246.0/27

; ----------------------------------------------------------------------------
; Plivo Outbound SIP Trunk
; ----------------------------------------------------------------------------
[plivo-outbound]
type=endpoint
context=hr-voicebot-inbound
transport=transport-udp
disallow=all
allow=ulaw
allow=alaw
aors=plivo-outbound-aor
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[plivo-outbound-aor]
type=aor
contact=sip:55329168785806490.zt.plivo.com:5060

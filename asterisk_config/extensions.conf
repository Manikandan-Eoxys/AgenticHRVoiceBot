; ============================================================================
; asterisk_config/extensions.conf
; Dialplan Routing for Agentic HR VoiceBot
; ============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[hr-voicebot-inbound]
; Echo test for audio verification
exten => 600,1,NoOp(Audio Echo Test)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

; Direct Inbound route to HR Voice Agent via ARI Stasis
exten => 100,1,NoOp(Inbound Call from ${CALLERID(num)} to HR VoiceBot)
 same => n,Answer()
 same => n,Stasis(hr_voicebot)
 same => n,Hangup()

; Fallback for any dialed extension in this context
exten => _X.,1,NoOp(Inbound Call ${EXTEN} from ${CALLERID(num)})
 same => n,Answer()
 same => n,Stasis(hr_voicebot)
 same => n,Hangup()

; Hangup handler
exten => h,1,NoOp(Call hung up by party)

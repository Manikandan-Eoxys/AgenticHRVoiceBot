; ============================================================================
; asterisk_config/extensions.conf
; Dialplan Routing for Agentic HR VoiceBot
; ============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[hr-voicebot-inbound]
; Built-in Asterisk Echo test for local verification
exten => 600,1,NoOp(Asterisk Internal Echo Test)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

; Extension 700: AudioSocket Python Echo Test (Phase 1 acceptance test)
exten => 700,1,NoOp(AudioSocket Python Echo Test on Extension 700)
 same => n,Answer()
 same => n,AudioSocket(00000000-0000-0000-0000-000000000700,127.0.0.1:4040)
 same => n,Hangup()

; Extension 100: Direct Inbound route to HR Voice Agent via ARI Stasis
exten => 100,1,NoOp(Inbound Call from ${CALLERID(num)} to HR VoiceBot 100)
 same => n,Answer()
 same => n,Stasis(hr_voicebot)
 same => n,Hangup()

; Extension 1000: Stasis route for HR Voice Agent
exten => 1000,1,NoOp(Inbound Call from ${CALLERID(num)} to HR VoiceBot 1000)
 same => n,Answer()
 same => n,Stasis(hr_voicebot)
 same => n,Hangup()

; Fallback for any other dialed number in this context
exten => _X.,1,NoOp(Fallback Inbound Call ${EXTEN} from ${CALLERID(num)})
 same => n,Answer()
 same => n,Stasis(hr_voicebot)
 same => n,Hangup()

; Hangup handler
exten => h,1,NoOp(Call hung up by party)

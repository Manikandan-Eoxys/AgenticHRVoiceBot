; ============================================================================
; asterisk_config/extensions.conf
; Dialplan Routing for Agentic HR VoiceBot with WebRTC & Call Concurrency Control
; ============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; Global Call Concurrency Settings
GLOBAL_MAX_TOTAL_CALLS=10
GLOBAL_MAX_CALLS_PER_USER=2

[hr-voicebot-inbound]
; Built-in Asterisk Echo test for local verification
exten => 600,1,NoOp(Asterisk Internal Echo Test)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

; Extension 700: AudioSocket Python Echo Test (Phase 1 acceptance test)
exten => 700,1,NoOp(AudioSocket Python Echo Test on Extension 700)
 same => n,Answer()
 same => n,AudioSocket(00000000-0000-0000-0000-000000000700,127.0.0.1:4040)
 same => n,Hangup()

; Extension 200: Dedicated WebRTC Browser Client Entry Point
exten => 200,1,NoOp(Incoming WebRTC Call on Extension 200)
 same => n,Gosub(sub-voicebot-gate,s,1(200))
 same => n,Hangup()

; Extension 100: Softphone / WebRTC / PSTN Direct Inbound
exten => 100,1,NoOp(Inbound Call to Extension 100)
 same => n,Gosub(sub-voicebot-gate,s,1(100))
 same => n,Hangup()

; Extension 1000: Stasis route for HR Voice Agent
exten => 1000,1,NoOp(Inbound Call to Extension 1000)
 same => n,Gosub(sub-voicebot-gate,s,1(1000))
 same => n,Hangup()

; Catch calls routed to default 's' extension (Direct SIP URI from Plivo)
exten => s,1,NoOp(Inbound Call without DID to HR VoiceBot)
 same => n,Gosub(sub-voicebot-gate,s,1(s))
 same => n,Hangup()

; Fallback for any other dialed number in this context (Plivo DID lands here)
exten => _X.,1,NoOp(Fallback Inbound Call ${EXTEN} from ${CALLERID(num)})
 same => n,Gosub(sub-voicebot-gate,s,1(${EXTEN}))
 same => n,Hangup()

exten => _+X.,1,NoOp(Fallback Inbound Call with + ${EXTEN} from ${CALLERID(num)})
 same => n,Gosub(sub-voicebot-gate,s,1(${EXTEN}))
 same => n,Hangup()

; Hangup handler
exten => h,1,NoOp(Call hung up by party)


; ============================================================================
; Subroutine: Active Session Tracking & Call Control Gate
; Enforces concurrency limits and returns Busy (SIP 486) or Congestion
; ============================================================================
[sub-voicebot-gate]
exten => s,1,NoOp(--- [VOICEBOT INBOUND GATE] Call to ${ARG1} from '${CALLERID(num)}' [Channel: ${CHANNEL(name)}] ---)

 ; 1. Active Call Tracking: Check Global Concurrent Call Limit
 same => n,Set(GROUP(global)=voicebot_total)
 same => n,Set(TOTAL_ACTIVE=${GROUP_COUNT(voicebot_total@global)})
 same => n,Set(MAX_TOTAL=${GLOBAL(GLOBAL_MAX_TOTAL_CALLS)})
 same => n,ExecIf($["${MAX_TOTAL}" = ""]?Set(MAX_TOTAL=10))
 same => n,NoOp([CALL CONTROL] Active voicebot calls: ${TOTAL_ACTIVE} / ${MAX_TOTAL})
 same => n,GotoIf($[${TOTAL_ACTIVE} > ${MAX_TOTAL}]?limit_exceeded)

 ; 2. Active Call Tracking: Check Per-User Active Call Limit (reject duplicate simultaneous calls)
 same => n,Set(CALLER_ID=${CALLERID(num)})
 same => n,ExecIf($["${CALLER_ID}" = ""]?Set(CALLER_ID=anonymous))
 same => n,Set(GROUP(caller)=${CALLER_ID})
 same => n,Set(USER_ACTIVE=${GROUP_COUNT(${CALLER_ID}@caller)})
 same => n,Set(MAX_USER=${GLOBAL(GLOBAL_MAX_CALLS_PER_USER)})
 same => n,ExecIf($["${MAX_USER}" = ""]?Set(MAX_USER=2))
 same => n,NoOp([CALL CONTROL] Active calls for user '${CALLER_ID}': ${USER_ACTIVE} / ${MAX_USER})
 same => n,GotoIf($[${USER_ACTIVE} > ${MAX_USER}]?user_busy)

 ; 3. Limit Check Passed: Answer Channel & Enter Stasis (ARI AI Voice Agent)
 same => n,NoOp(>>> Call approved within limits. Answering channel and routing to Stasis(hr_voicebot)...)
 same => n,Answer()
 same => n,Stasis(hr_voicebot)
 same => n,Hangup()
 same => n,Return()

 ; ----------------------------------------------------------------------------
 ; Over-Limit Handling: Return Busy (SIP 486 Busy Here)
 ; ----------------------------------------------------------------------------
 same => n(limit_exceeded),NoOp(🚫 [BUSY REJECTION] Max system concurrent call limit (${GLOBAL(GLOBAL_MAX_TOTAL_CALLS)}) reached! Total active: ${TOTAL_ACTIVE})
 same => n,Busy(5)
 same => n,Hangup()
 same => n,Return()

 same => n(user_busy),NoOp(🚫 [BUSY REJECTION] User '${CALLER_ID}' already has an active call (${USER_ACTIVE})! Rejecting duplicate call.)
 same => n,Busy(5)
 same => n,Hangup()
 same => n,Return()


[hr-voicebot-outbound]
exten => _X.,1,NoOp(Outbound call to ${EXTEN} via Plivo)
 same => n,Set(CALLERID(all)="HR Voicebot" <918031451001>)
 same => n,Dial(PJSIP/${EXTEN}@plivo-outbound,60)
 same => n,Hangup()

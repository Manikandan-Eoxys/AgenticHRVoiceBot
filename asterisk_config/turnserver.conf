# ============================================================================
# asterisk_config/turnserver.conf
# coturn STUN/TURN Server Configuration for Asterisk WebRTC
# ============================================================================

# Network listening ports
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# External Public IP for NAT traversal
# Update this with your server's public IP address
external-ip=115.99.235.223

# Relay settings
min-port=49152
max-port=65535

# Authentication & Security
realm=voicebot.local
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=VoiceBotTurnSecretKey2026
user=hrbot:TurnSecretPass2026

# Logging
log-file=/var/log/turnserver.log
verbose
no-cli

